<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="395" viewBox="0 0 1050 395" role="img">
<title>How learning rate affects accuracy</title>
<rect width="100%" height="100%" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#243247}.tick{font-size:12px}</style>
<text x="28" y="32" font-size="22" font-weight="bold">How learning rate affects accuracy</text>
<text x="28" y="55" font-size="12">Each point is a full-data evaluation.</text>
<text x="88" y="90" font-size="16" font-weight="bold">Final-epoch accuracy on the validation split</text>
<line x1="88" x2="805" y1="300.00" y2="300.00" stroke="#e5eaf0"/>
<text class="tick" x="78" y="304.00" text-anchor="end">61.8</text>
