<text class="tick" x="78" y="256.50" text-anchor="end">66.3</text>
<line x1="88" x2="805" y1="205.00" y2="205.00" stroke="#e5eaf0"/>
<text class="tick" x="78" y="209.00" text-anchor="end">70.9</text>
<line x1="88" x2="805" y1="157.50" y2="157.50" stroke="#e5eaf0"/>
<text class="tick" x="78" y="161.50" text-anchor="end">75.4</text>
<line x1="88" x2="805" y1="110.00" y2="110.00" stroke="#e5eaf0"/>
<text class="tick" x="78" y="114.00" text-anchor="end">79.9</text>
<line x1="88.00" x2="88.00" y1="110" y2="300" stroke="#f1f4f8"/>
<text class="tick" x="88.00" y="320" text-anchor="middle">0.0001</text>
<line x1="267.25" x2="267.25" y1="110" y2="300" stroke="#f1f4f8"/>
<text class="tick" x="267.25" y="320" text-anchor="middle">0.001</text>
<line x1="446.50" x2="446.50" y1="110" y2="300" stroke="#f1f4f8"/>
<text class="tick" x="446.50" y="320" text-anchor="middle">0.01</text>
<line x1="625.75" x2="625.75" y1="110" y2="300" stroke="#f1f4f8"/>
<text class="tick" x="625.75" y="320" text-anchor="middle">0.1</text>
<line x1="805.00" x2="805.00" y1="110" y2="300" stroke="#f1f4f8"/>
<text class="tick" x="805.00" y="320" text-anchor="middle">1</text>
<polyline fill="none" stroke="#2563eb" stroke-width="1.8" points="88.00,286.90 267.25,272.01 446.50,201.28 625.75,147.30 805.00,130.55"/>
<circle cx="88.00" cy="286.90" r="3.5" fill="#2563eb"/>
<circle cx="267.25" cy="272.01" r="3.5" fill="#2563eb"/>
<circle cx="446.50" cy="201.28" r="3.5" fill="#2563eb"/>
<circle cx="625.75" cy="147.30" r="3.5" fill="#2563eb"/>
<circle cx="805.00" cy="130.55" r="3.5" fill="#2563eb"/>
<line x1="830" x2="851" y1="118" y2="118" stroke="#2563eb" stroke-width="3"/>
<text x="860" y="122" font-size="12">GD</text>
<polyline fill="none" stroke="#e07812" stroke-width="1.8" points="88.00,124.96 267.25,124.96 446.50,139.86 625.75,193.83 805.00,188.25"/>
<circle cx="88.00" cy="124.96" r="3.5" fill="#e07812"/>
<circle cx="267.25" cy="124.96" r="3.5" fill="#e07812"/>
<circle cx="446.50" cy="139.86" r="3.5" fill="#e07812"/>
<circle cx="625.75" cy="193.83" r="3.5" fill="#e07812"/>
<circle cx="805.00" cy="188.25" r="3.5" fill="#e07812"/>
<line x1="830" x2="851" y1="145" y2="145" stroke="#e07812" stroke-width="3"/>
<text x="860" y="149" font-size="12">SGD</text>
<polyline fill="none" stroke="#18856c" stroke-width="1.8" points="88.00,152.88 267.25,123.10 446.50,162.19 625.75,186.39 805.00,201.28"/>
<circle cx="88.00" cy="152.88" r="3.5" fill="#18856c"/>
<circle cx="267.25" cy="123.10" r="3.5" fill="#18856c"/>
<circle cx="446.50" cy="162.19" r="3.5" fill="#18856c"/>
<circle cx="625.75" cy="186.39" r="3.5" fill="#18856c"/>
<circle cx="805.00" cy="201.28" r="3.5" fill="#18856c"/>
<line x1="830" x2="851" y1="172" y2="172" stroke="#18856c" stroke-width="3"/>
<text x="860" y="176" font-size="12">Adam</text>
<path d="M 88 110 V 300 H 805" fill="none" stroke="#9ca9ba"/>
<text x="446.5" y="344" font-size="13" text-anchor="middle">Learning rate (log scale)</text>
